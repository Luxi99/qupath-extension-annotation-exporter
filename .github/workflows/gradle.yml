name: Build, Test + Draft Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  # -----------------------------------------------------------------
  # Job 1: eseguito ad OGNI push (branch o tag) e su ogni pull request.
  # Compila e testa il progetto, escludendo i test che richiedono
  # un vero toolkit grafico JavaFX (vedi tag "requires-javafx" nei test
  # e la relativa esclusione in build.gradle.kts basata su System.getenv("CI")).
  # -----------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Concedi permessi di esecuzione a gradlew
        run: chmod +x ./gradlew

      - name: Build e test (CI=true esclude automaticamente i test JavaFX)
        run: ./gradlew clean build
        env:
          CI: true

      - name: Carica i risultati dei test come artefatto (utile per debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          retention-days: 7

  # -----------------------------------------------------------------
  # Job 2: eseguito SOLO quando il push riguarda un tag "v*".
  # Rigenera il jar con shadowJar (fondamentale per includere le
  # dipendenze non fornite di default da QuPath) e lo allega
  # automaticamente a una GitHub Release.
  # -----------------------------------------------------------------
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessario per poter creare la release e allegare file
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Concedi permessi di esecuzione a gradlew
        run: chmod +x ./gradlew

      - name: Build del jar con shadowJar (include le dipendenze)
        run: ./gradlew clean shadowJar
        env:
          CI: true

      - name: Individua il jar generato
        id: find_jar
        run: |
          JAR_PATH=$(find build/libs -name "*-all.jar" -o -name "*-shadow.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            # fallback: prende il jar più recente in build/libs se il naming è diverso
            JAR_PATH=$(find build/libs -name "*.jar" | sort -V | tail -n 1)
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Trovato jar: $JAR_PATH"

      - name: Crea la GitHub Release e allega il jar
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_jar.outputs.jar_path }}
          generate_release_notes: true
          draft: true
          prerelease: false
