name: Make draft release

on:
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build shadowJar e crea la draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Concedi permessi di esecuzione a gradlew
        run: chmod +x ./gradlew

      - name: Leggi la versione da build.gradle.kts
        id: get_version
        shell: bash
        run: |
          VERSION=$(./gradlew -q printVersion)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versione rilevata: $VERSION"

      - name: Esegui i test (esclusi quelli che richiedono JavaFX)
        run: ./gradlew clean test
        env:
          CI: true

      - name: Build del jar con shadowJar (include le dipendenze)
        run: ./gradlew shadowJar
        env:
          CI: true

      - name: Individua il jar generato
        id: find_jar
        shell: bash
        run: |
          JAR_PATH=$(find build/libs -name "*-all.jar" -o -name "*-shadow.jar" | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            JAR_PATH=$(find build/libs -name "*.jar" | sort -V | tail -n 1)
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "Trovato jar: $JAR_PATH"

      - name: Crea la draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.get_version.outputs.version }}" \
              --draft \
              --title "v${{ steps.get_version.outputs.version }}" \
              --notes "Release v${{ steps.get_version.outputs.version }}" \
              "${{ steps.find_jar.outputs.jar_path }}"
